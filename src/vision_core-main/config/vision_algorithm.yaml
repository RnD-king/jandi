vision_algorithm:
  line_features:
    max_centers: 8
    image_center_u: 320.0
    lookahead_delta_v_px: 190.0
    curve_min_points: 5
    curve_min_v_span_px: 80.0
    curve_local_fit_points: 4
    curve_full_scale_angle_rad: 0.35
    curve_smoothing_alpha: 0.20
    curve_missing_decay: 0.96
    curve_lookahead_min_scale: 0.68
    guide_fit_rmse_full_scale_px: 20.0
    lookahead_alpha_normal: 0.70
    lookahead_alpha_recovery: 0.20
    recover_enter_nvis: 2.0
    recover_exit_nvis: 3.0
    recover_enter_u: 0.70
    recover_exit_u: 0.35

  line:
    line_stable_window: 10
    line_stable_min_hits: 7
    line_reacquire_nvis: 3.0
    line_reacquire_u: 0.35
    cmd_vx_min: 0.10
    cmd_vx_max: 1.20
    cmd_wz_min: -1.90
    cmd_wz_max: 1.90
    v_base: 0.85
    tracking_speed_scale: 0.80
    k_u: 3.00
    k_slope: 3.00
    k_v_u: 0.35
    k_v_slope: 0.25
    dv_max: 0.12
    dw_max: 0.40
    recover_vx: 0.12
    recover_wz: 0.75
    line_recovery_vx_max: 0.45
    low_visible_n: 2.0
    no_visible_n: 0.5
    low_visible_vx: 0.18
    no_visible_vx: 0.10
    low_visible_wz_decay: 0.90
    no_visible_wz_decay: 0.95
    recover_coast_s: 0.30
    recover_lookahead_m: 0.55
    recover_search_delay_s: 0.35
    recover_sweep_period_s: 1.20
    recover_search_wz_min: 0.22
    recover_search_wz_max: 0.70
    recover_k_bearing: 1.35
    recover_k_heading: 0.45
    recover_k_cross_track: 0.70
    recover_path_backtrack_m: 0.35
    recover_path_forward_margin_m: 1.00
    recover_side_memory_alpha: 0.18

  line_p2p:
    offset_gain: 1.0
    heading_gain: 1.0
    curvature_gain: 1.0
    short_post_collect_sec: 1.0
    no_action_hold_sec: 2.0

  ball:
    stable_window: 10
    stable_min_hits: 7
    lost_frames: 5
    smooth_alpha: 0.45
    far_u_des_norm: 0.50
    far_vx: 0.35
    far_vx_min: 0.10
    far_wz_max: 0.80
    far_heading_gain: 2.50
    far_slow_by_turn: 0.60
    far_dv_max: 0.12
    far_dw_max: 0.35
    far_speed_scale: 0.90
    upper_acquire_v_norm: 0.65
    tilt_down_v_norm: 0.75
    tilt_down_window: 10
    tilt_down_min_hits: 7
    tilt_down_h_norm: 0.18
    camera_tilt_duration_sec: 0.50
    camera_settle_sec: 0.25
    camera_return_duration_sec: 0.50
    camera_motion_timeout_sec: 3.0
    hold_cmd_window: 5
    hold_vx_min: 0.15
    hold_vx_max: 0.25
    hold_wz_max: 0.25
    hold_default_vx: 0.18
    tilt_walk_speed_scale: 0.50
    tilt_walk_vx_max: 0.25
    fine_adjust_placeholder_vx: 0.15
    fine_adjust_placeholder_duration_sec: 1.0
    pickup_placeholder_duration_sec: 3.0
    pickup_verification_placeholder_sec: 0.0
    stand_up_placeholder_sec: 0.0
    pickup_max_attempts: 3
    pickup_success_missing_frames: 5
    post_pickup_back_away_vx: -0.10
    post_pickup_back_away_sec: 1.0
    rl_stop_duration_sec: 1.50
    ball_ignore_duration_sec: 30.0
    near_target_u_norm: 0.50
    near_target_v_norm: 0.70
    near_kx: 0.50
    near_ky: 0.45
    near_wz_gain: 0.80
    near_vx_max: 0.18
    near_vy_max: 0.15
    near_wz_max: 0.50
    near_x_tol: 0.06
    near_y_tol: 0.06
    near_use_lateral: true
    recovery_timeout_sec: 2.0
    recovery_reacquire_min_hits: 3
    recovery_center_tolerance_norm: 0.12
    recovery_forward_vx: 0.10
    recovery_turn_wz: 0.25

  hurdle:
    stable_window: 30
    stable_min_hits: 20
    lost_frames: 5
    smooth_alpha: 0.45
    target_u_norm: 0.50
    approach_vx: 0.35
    approach_speed_scale: 0.75
    approach_wz_gain: 2.50
    approach_wz_max: 0.80
    approach_dw_max: 0.35
    acquire_min_v_norm: 0.60
    tilt_trigger_v_norm: 0.75
    tilt_trigger_window: 10
    tilt_trigger_min_hits: 7
    tilt_walk_speed_scale: 0.50
    tilt_walk_vx_max: 0.25
    tilt_walk_default_vx: 0.10
    camera_motion_timeout_sec: 3.0
    contact_walk_placeholder_vx: 0.10
    contact_walk_placeholder_sec: 2.0
    cross_placeholder_sec: 3.0
    hurdle_ignore_duration_sec: 5.0
    rl_stop_duration_sec: 1.50
    recovery_reacquire_min_hits: 3
    recovery_timeout_sec: 5.0
    recovery_center_tolerance_norm: 0.12
    recovery_forward_vx: 0.10
    recovery_turn_wz: 0.25

  goal:
    stable_window: 10
    stable_min_hits: 7
    lost_frames: 5
    smooth_alpha: 0.45
    # 공 집기 뒤 라인을 다시 잡은 시점부터 이 시간 동안 라인을 계속 따라간 뒤
    # 골대 카메라를 든다.
    post_pickup_wait_sec: 3.0
    camera_motion_timeout_sec: 3.0
    camera_tilt_forward_vx: 0.30
    # 호환용 설정. 현재 백보드 search는 정지 관측하며 회전하지 않는다.
    search_wz: 0.30
    target_u_norm: 0.50
    approach_vx: 0.25
    approach_wz_gain: 2.0
    approach_wz_max: 0.70
    fine_adjust_start_z_m: 0.80
    hoop_radius_m: 0.10
    throwing_range_m: 0.40
    target_yaw_rad: 0.0
    position_tolerance_m: 0.08
    yaw_tolerance_rad: 0.1396263402
    fine_vx_gain: 0.60
    fine_vy_gain: 0.80
    fine_wz_gain: 1.00
    fine_translation_min: 0.10
    fine_wz_min: 0.20
    fine_vx_max: 0.125
    fine_vy_max: 0.10
    fine_wz_max: 0.30
    fine_pulse_duration_sec: 0.80
    fine_near_pulse_duration_sec: 0.60
    fine_near_error_m: 0.12
    fine_settle_duration_sec: 0.60
    fine_adjust_window: 10
    fine_adjust_min_hits: 7
    shoot_placeholder_sec: 2.0
    rl_stop_duration_sec: 1.50

  line_detection:
    class_id: 0
    confidence: 0.60
    min_box_width: 1.0
    min_box_height: 1.0

  object_targets:
    ball_class_id: 1
    goal_class_id: 2
    backboard_class_id: 3
    hurdle_class_id: 4
    ball_confidence: 0.60
    goal_confidence: 0.60
    backboard_confidence: 0.60
    hurdle_confidence: 0.60
    min_box_width: 2.0
    min_box_height: 2.0

  object_association:
    missing_frame_limit: 5
    max_center_distance_norm: 0.25
    max_size_log_ratio: 0.80
    center_distance_weight: 1.0
    size_change_weight: 0.25

  command:
    first_action_id: 1
    locomotion_backend: "p2p"
    # ACTION 발행 뒤 이 시간 안에 ACK가 없으면 중복 실행 방지를 위해
    # ACK_TIMEOUT 정지 상태로 잠그며 Reset으로만 해제한다.
    action_ack_timeout_sec: 10.0
    p2p:
      forward_deadband: 0.02
      lateral_deadband: 0.02
      yaw_deadband: 0.05
      long_forward_vx: 0.22
      curve_yaw_threshold: 0.10
      sharp_turn_yaw_threshold: 0.30
      turn_in_place_vx_max: 0.05
      lateral_dominance_ratio: 1.0
    p2p_fine:
      forward_deadband: 0.01
      lateral_deadband: 0.01
      yaw_deadband: 0.03
      long_forward_vx: 1.0
      curve_yaw_threshold: 0.05
      sharp_turn_yaw_threshold: 0.15
      turn_in_place_vx_max: 0.03
      lateral_dominance_ratio: 0.75
    p2p_recovery:
      forward_deadband: 0.02
      lateral_deadband: 0.02
      yaw_deadband: 0.04
      long_forward_vx: 1.0
      curve_yaw_threshold: 0.08
      sharp_turn_yaw_threshold: 0.24
      turn_in_place_vx_max: 0.08
      lateral_dominance_ratio: 1.0

  mission:
    backboard_min_depth_m: 0.20
    backboard_max_depth_m: 5.00
    line_observation_dt: 0.06666666666666667
    enable_ball: true
    enable_hurdle: true
    enable_goal: true
    initial_has_ball: false
